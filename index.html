:1.9rem;letter-spacing:.2px}header h1 .h{color:var(--accent);display:inline-block;animation:beat 1.6s ease-in-out infinite}header p{margin:4px 0 0;color:var(--muted);font-size:.95rem}.spark{position:absolute;color:var(--accent);opacity:.8;animation:twinkle 2.4s ease-in-out infinite}.spark.s1{left:8%;top:6px;font-size:1.1rem}.spark.s2{right:10%;top:0;font-size:1.4rem;animation-delay:.8s}.spark.s3{right:22%;bottom:-2px;font-size:.9rem;animation-delay:1.5s}.seg{display:flex;gap:4px;background:var(--soft);border:2px solid var(--line);border-radius:999px;padding:3px;width:max-content;margin:0 auto 6px}.seg button{padding:6px 14px;border-radius:999px;font-size:.85rem;font-weight:700;color:var(--muted);transition:.2s}.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 3px 8px var(--shadow)}.cakewrap{position:relative;max-width:300px;margin:0 auto}.cakewrap svg{width:100%;height:auto;display:block;overflow:visible}.plate{fill:var(--plate)}.plate2{fill:var(--plate2)}.layer{opacity:0;transform:translateY(-34px);transform-box:fill-box;transition:opacity .5s ease,transform .6s cubic-bezier(.34,1.56,.64,1)}.layer.on{opacity:1;transform:none}.tw{animation:twinkle 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.cakewrap .slice-g{transition:opacity .5s ease,transform .6s cubic-bezier(.5,-0.3,.6,1);transform-box:fill-box;transform-origin:center}.slice-g.gone{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.8)}.bar{height:12px;border-radius:99px;background:var(--soft);border:2px solid var(--line);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--topping),var(--accent));border-radius:99px;transition:width .6s cubic-bezier(.34,1.3,.64,1)}#stat{text-align:center;margin:8px 0 0;font-weight:700;font-size:.95rem}#stat small{display:block;color:var(--muted);font-weight:600;margin-top:2px}.mascot-row{display:flex;align-items:center;gap:12px}#mascot{width:92px;flex:none;overflow:visible;transition:transform .3s}#mascot:hover{animation:wiggle .6s}#mascot.cheer{animation:hop .7s}.bubble{position:relative;flex:1;background:var(--soft);border:2px solid var(--line);border-radius:18px;padding:10px 12px;min-height:74px}.bubble::before{content:"";position:absolute;left:-9px;top:28px;width:14px;height:14px;background:var(--soft);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}#cakeName{width:100%;border:0;background:transparent;font-weight:800;font-size:.95rem;color:var(--accent-d);outline:none;padding:0;border-bottom:2px dashed transparent}#cakeName:hover,#cakeName:focus{border-bottom-color:var(--line)}[data-dark="1"] #cakeName{color:var(--accent)}#say{margin:3px 0 0;font-size:.92rem;line-height:1.35}.addrow{display:flex;gap:8px}#newTask{flex:1;min-width:0;border:2px solid var(--line);background:var(--soft);border-radius:16px;padding:12px 14px;outline:none;transition:.2s;color:var(--ink)}#newTask::placeholder{color:var(--muted)}#newTask:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--shadow)}#newTask.shake{animation:shake .4s}#addBtn{background:linear-gradient(180deg,var(--topping),var(--accent));color:#fff;font-weight:800;padding:0 18px;border-radius:16px;box-shadow:0 5px 0 var(--accent-d),0 8px 14px var(--shadow);transition:transform .1s,box-shadow .1s;white-space:nowrap}#addBtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d)}#addBtn.bounce{animation:bounce .5s}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{border:2px solid var(--line);background:var(--soft);border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:700;color:var(--muted);transition:.18s;display:inline-flex;gap:4px;align-items:center}.chip:hover{transform:translateY(-2px) rotate(-2deg)}.chip[aria-pressed="true"]{background:var(--fc,var(--accent));border-color:var(--fc,var(--accent));color:#fff;box-shadow:0 3px 8px var(--shadow)}.label{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:12px 0 -4px}.label:first-child{margin-top:0}#list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}.task{display:flex;align-items:center;gap:10px;background:var(--soft);border:2px solid var(--line);border-left:7px solid var(--fc);border-radius:16px;padding:9px 10px;transition:transform .2s,opacity .3s}.task:hover{transform:rotate(-.7deg) translateX(2px)}.task.enter{animation:slideIn .45s cubic-bezier(.34,1.56,.64,1)}.check{flex:none;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--fc);background:#fff;color:#fff;font-weight:900;line-height:1;display:grid;place-items:center;transition:.2s}[data-dark="1"] .check{background:transparent}.check:hover{transform:scale(1.12)}.task.done .check{background:var(--fc)}.check.pop{animation:pop .5s}.txt{flex:1;min-width:0;word-break:break-word;font-weight:600;transition:.25s}.task.done .txt{text-decoration:line-through;text-decoration-color:var(--fc);text-decoration-thickness:2.5px;opacity:.55}.tag{flex:none;font-size:.72rem;font-weight:800;color:var(--fc);background:var(--card);border-radius:999px;padding:3px 8px;border:1.5px solid var(--fc)}.del{flex:none;width:26px;height:26px;border-radius:50%;color:var(--muted);font-size:1.2rem;line-height:1;opacity:.55;transition:.2s}.del:hover{opacity:1;color:#e04a5a;transform:rotate(90deg)}.empty{text-align:center;color:var(--muted);padding:18px 8px;font-weight:600}.empty b{display:block;font-size:1.6rem;margin-bottom:4px;animation:float 3s ease-in-out infinite}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}.ghost{font-size:.82rem;font-weight:800;color:var(--muted);padding:7px 12px;border-radius:999px;border:2px dashed var(--line);transition:.2s}.ghost:hover{color:var(--accent-d);border-color:var(--accent)}.settings{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.swatches{display:flex;gap:8px;align-items:center}.sw{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);transition:.2s}.sw:hover{transform:scale(1.15)}.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}.toggles{display:flex;gap:6px}.tg{width:38px;height:38px;border-radius:50%;background:var(--soft);border:2px solid var(--line);font-size:1.05rem;transition:.2s}.tg:hover{transform:rotate(-10deg) scale(1.08)}.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}.credit{text-align:center;color:var(--muted);font-size:.8rem;margin:2px 0 0}#fx{position:fixed;inset:0;pointer-events:none;z-index:50}@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(20deg)}}@keyframes slideIn{from{opacity:0;transform:translateX(-30px) scale(.9)}to{opacity:1;transform:none}}@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5) rotate(-12deg)}100%{transform:scale(1)}}@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(.88)}60%{transform:scale(1.12)}100%{transform:scale(1)}}@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}@keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(0) rotate(5deg)}80%{transform:translateY(-8px)}100%{transform:none}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}</style>

<body>

<script>(() => {
const $ = id => document.getElementById(id);
const FLAVORS = {
strawberry:{emoji:'🍓',label:'Chores',   color:'#ff6f9f'},
blueberry: {emoji:'🫐',label:'Study',    color:'#6f86ff'},
matcha:    {emoji:'🍵',label:'Work',     color:'#6fae52'},
chocolate: {emoji:'🍫',label:'Self-care',color:'#a9694a'},
lemon:     {emoji:'🍋',label:'Fun',      color:'#e6b422'}
};
const THEMES = {
strawberry:'#ff6f9f', blueberry:'#6f86ff', matcha:'#7bb661', chocolate:'#a9694a'
};
const DONE_MSGS = [
'Delicious work ♡','Another slice down!','Yum! One less thing ♡','Sweet, sweet progress ✦',
'Crumb-ly perfect!','Slice of victory ♡','Look at you go, sugarplum!','Mmm, that was a good one ♡'
];
const UNDO_MSGS = ['Back in the oven it goes!','Needs a little more baking ♡','No worries, we\'ll get it later ♡'];
const ADD_MSGS  = ['Fresh batter added ♡','Ooh, a new flavor!','Into the mixing bowl it goes ✦','Yum, more to bake!'];
const pick = a => a[Math.floor(Math.random()*a.length)];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const KEY = 'cheesecake-tasks-v2';
let S = {tasks:[], name:'Cheesie', theme:'strawberry', dark:false, mute:false, mode:'build', filter:'all'};
try { const raw = localStorage.getItem(KEY); if (raw) Object.assign(S, JSON.parse(raw)); } catch(e){}
if (!FLAVORS[S.filter] && S.filter !== 'all') S.filter = 'all';
if (!THEMES[S.theme]) S.theme = 'strawberry';
S.tasks = (S.tasks||[]).filter(t => t && t.text).map(t => ({...t, flavor: FLAVORS[t.flavor] ? t.flavor : 'strawberry'}));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
let selFlavor = 'strawberry';
const fresh = new Set();
let popId = null, sayTimer = 0;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stats = () => {
const n = S.tasks.length, d = S.tasks.filter(t => t.done).length;
return {n, d, p: n ? d/n : 0};
};
let AC;
const ac = () => {
if (!AC) { try { AC = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
if (AC && AC.state === 'suspended') AC.resume();
return AC;
};
const tone = (f0, f1, t0, dur, type, vol) => {
const a = ac(); if (!a) return;
const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
o.type = type;
o.frequency.setValueAtTime(f0, t);
o.frequency.exponentialRampToValueAtTime(f1, t + dur);
g.gain.setValueAtTime(0.0001, t);
g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
o.connect(g); g.connect(a.destination);
o.start(t); o.stop(t + dur + 0.03);
};
const sPop   = () => { if (!S.mute) tone(520, 920, 0, .13, 'sine', .18); };
const sAdd   = () => { if (!S.mute) tone(380, 560, 0, .09, 'sine', .12); };
const sUndo  = () => { if (!S.mute) tone(420, 260, 0, .12, 'sine', .1); };
const sChime = () => { if (!S.mute) [660,830,990,1320].forEach((f,i) => tone(f, f, i*.11, .4, 'triangle', .14)); };
const buzz   = p => { if (!S.mute && navigator.vibrate) try { navigator.vibrate(p); } catch(e){} };
const cv = $('fx'), cx = cv.getContext('2d');
let parts = [], raf = 0, dpr = 1;
const sizeCanvas = () => {
dpr = window.devicePixelRatio || 1;
cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
};
addEventListener('resize', sizeCanvas); sizeCanvas();
const CHARS = ['♥','♡','✦','✧','●','★'];
const COLS = ['#ff6f9f','#ffb3cc','#ffd36e','#ffffff','#b89bff','#7fd6c2','#ff8fb3'];
const burst = (x, y, n) => {
if (reduced) return;
for (let i = 0; i < n; i++) {
const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7;
parts.push({
x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp - 4, g: .2,
rot: Math.random()*6, vr: (Math.random()-.5)*.3,
life: 1, decay: .01 + Math.random()*.012,
ch: pick(CHARS), col: pick(COLS), sz: 12 + Math.random()*12
});
}
if (!raf) raf = requestAnimationFrame(loop);
};
const loop = () => {
cx.setTransform(dpr,0,0,dpr,0,0);
cx.clearRect(0, 0, innerWidth, innerHeight);
parts = parts.filter(p => p.life > 0 && p.y < innerHeight + 40);
for (const p of parts) {
p.vy += p.g; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= p.decay;
cx.save();
cx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.4));
cx.translate(p.x, p.y); cx.rotate(p.rot);
cx.fillStyle = p.col; cx.font = p.sz + 'px sans-serif';
cx.textAlign = 'center'; cx.textBaseline = 'middle';
cx.fillText(p.ch, 0, 0);
cx.restore();
}
raf = parts.length ? requestAnimationFrame(loop) : 0;
if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
};
const bigCelebration = () => {
const w = innerWidth, h = innerHeight;
burst(w*.2, h*.45, 40); burst(w*.8, h*.45, 40); burst(w*.5, h*.3, 60);
setTimeout(() => { burst(w*.35, h*.35, 40); burst(w*.65, h*.35, 40); }, 350);
};
const faces = {
sleepy:`<path d="M27 44h9M54 44h9" stroke="#5b2a3c" stroke-width="2.6" stroke-linecap="round"/>
<path d="M40 53h10" stroke="#5b2a3c" stroke-width="2.4" stroke-linecap="round"/>
<text x="66" y="16" font-size="11" fill="var(--accent)" font-weight="800">z</text>
<text x="74" y="8" font-size="8" fill="var(--accent)" font-weight="800">z</text>`,

<circle cx="45" cy="53" r="2.6" fill="none" stroke="#5b2a3c" stroke-width="2"/>`,

};
const mood = () => {

};

<rect x="6" y="58" width="78" height="14" rx="5" fill="#d49a5a"/>
<path d="M6 58V30Q6 22 14 22H76Q84 22 84 30V58Z" fill="#fff1c9"/>
<path fill="var(--topping)" d="M6 30Q6 20 16 20H74Q84 20 84 30V34q-6 8 -12 0 q-6 -6 -12 0 q-6 8 -12 0 q-6 -6 -12 0 q-6 8 -12 0 q-6 -6 -12 0 H6Z"/>
<path d="M45 18q4 -10 12 -12" stroke="#6a8f3a" stroke-width="2" fill="none" stroke-linecap="round"/>
<circle cx="45" cy="15" r="6.5" fill="#e5384f"/><circle cx="43" cy="13" r="1.8" fill="#fff" opacity=".65"/>
${faces[mood()]}`;

const idleMsg = () => {
const {n, d} = stats(), m = mood();
if (m === 'sleepy')  return 'Zzz… add a little thing to wake me ♡';
if (m === 'curious') return `${n} slice${n>1?'s':''} waiting. Let's bake!`;
if (m === 'happy')   return `${d} down, ${n-d} to go. You've got this ♡`;

};
const say = (txt, hold = 4200) => {
$('say').textContent = txt;
clearTimeout(sayTimer);
sayTimer = setTimeout(() => { $('say').textContent = idleMsg(); }, hold);
};
const cheer = () => {
const m = $('mascot'); m.classList.remove('cheer'); void m.getBoundingClientRect(); m.classList.add('cheer');
};
const STAGES = ['Empty plate','Crust','Filling','Topping','Cherry on top!'];
const renderBuild = () => {
const {n, p} = stats();
const on = {
Lcrust: p > 0, Lfill: p >= .33, Ltop: p >= .66, Lcherry: n > 0 && p === 1, Lspark: n > 0 && p === 1
};
for (const id in on) $(id).classList.toggle('on', on[id]);
return n === 0 ? STAGES[0] : STAGES[(p>0)+(p>=.33)+(p>=.66)+(p===1)];
};
let builtSlices = -1;
const sector = (cx0, cy0, r, a0, a1) => {
const x0 = cx0 + r*Math.cos(a0), y0 = cy0 + r*Math.sin(a0);
const x1 = cx0 + r*Math.cos(a1), y1 = cy0 + r*Math.sin(a1);
return `M${cx0} ${cy0}L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1-a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z`;
};
const buildSlices = n => {
const X = 120, Y = 95, R = 78;
let h = `<circle class="plate" cx="${X}" cy="${Y}" r="92"/><circle class="plate2" cx="${X}" cy="${Y}" r="86"/>`;
if (n === 0) {
h += `<circle cx="${X}" cy="${Y}" r="${R}" fill="#d49a5a"/><circle cx="${X}" cy="${Y}" r="71" fill="url(#cream)"/>
<circle cx="${X}" cy="${Y}" r="62" fill="var(--topping)" opacity=".9"/>
<circle cx="${X}" cy="${Y}" r="9" fill="#e5384f"/><circle cx="${X-3}" cy="${Y-3}" r="2.6" fill="#fff" opacity=".6"/>`;
} else {
for (let i = 0; i < n; i++) {
const a0 = -Math.PI/2 + i*2*Math.PI/n, a1 = a0 + 2*Math.PI/n, mid = (a0+a1)/2;
const dx = (Math.cos(mid)*46).toFixed(1), dy = (Math.sin(mid)*46).toFixed(1);
const cr = n > 12 ? 2.5 : 5;
const cxh = (X + Math.cos(mid)*(n===1?0:40)).toFixed(1), cyh = (Y + Math.sin(mid)*(n===1?0:40)).toFixed(1);
const shapes = n === 1
? `<circle cx="${X}" cy="${Y}" r="${R}" fill="#d49a5a"/><circle cx="${X}" cy="${Y}" r="71" fill="url(#cream)"/><circle cx="${X}" cy="${Y}" r="62" fill="var(--topping)" opacity=".9"/>`
: `<path d="${sector(X,Y,R,a0,a1)}" fill="#d49a5a"/><path d="${sector(X,Y,71,a0,a1)}" fill="url(#cream)"/><path d="${sector(X,Y,62,a0,a1)}" fill="var(--topping)" opacity=".9"/>`;
h += `<g class="slice-g" id="sl${i}" style="--dx:${dx}px;--dy:${dy}px" stroke="rgba(255,255,255,.85)" stroke-width="1.5">
${shapes}<circle cx="${cxh}" cy="${cyh}" r="${cr}" fill="#e5384f" stroke="none"/></g>`;
}
}
$('cakeSlice').innerHTML = `<defs><linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffe8ae"/></linearGradient></defs>` + h;
builtSlices = n;
};
const renderSlices = () => {
const {n, d} = stats();
if (builtSlices !== n) buildSlices(n);
S.tasks.forEach((t, i) => { const g = $('sl'+i); if (g) g.classList.toggle('gone', !!t.done); });
return n === 0 ? 'No slices yet' : (n-d === 0 ? 'Plate cleaned!' : `${n-d} slice${n-d>1?'s':''} left to eat`);
};
const renderCake = () => {
const {n, d, p} = stats();
const build = S.mode === 'build';
$('cakeBuild').hidden = !build; $('cakeSlice').hidden = build;
$('modeBuild').setAttribute('aria-pressed', build);
$('modeSlice').setAttribute('aria-pressed', !build);
const label = build ? renderBuild() : renderSlices();
$('barfill').style.width = Math.round(p*100) + '%';
$('stat').innerHTML = `${d} / ${n} done<small>${label}</small>`;
};
const renderPickers = () => {
$('flavorPick').innerHTML = '<span class="label" style="width:100%;margin:0 0 -2px">Flavor</span>' +
Object.entries(FLAVORS).map(([k, f]) =>
`<button class="chip" data-flavor="${k}" style="--fc:${f.color}" aria-pressed="${k===selFlavor}">${f.emoji} ${f.label}</button>`).join('');
const counts = {};
S.tasks.forEach(t => counts[t.flavor] = (counts[t.flavor]||0) + 1);
$('filters').innerHTML =
`<button class="chip" data-filter="all" aria-pressed="${S.filter==='all'}">All ${S.tasks.length}</button>` +
Object.entries(FLAVORS).map(([k, f]) =>
`<button class="chip" data-filter="${k}" style="--fc:${f.color}" aria-pressed="${S.filter===k}">${f.emoji}${counts[k] ? ' ' + counts[k] : ''}</button>`).join('');
};
const renderList = () => {
const vis = S.tasks.filter(t => S.filter === 'all' || t.flavor === S.filter);
const el = $('list');
if (!vis.length) {
el.innerHTML = S.tasks.length
? `<li class="empty"><b>🍰</b>Nothing in this flavor yet ♡</li>`
: `<li class="empty"><b>🍰</b>No slices yet — add your first little thing ♡</li>`;
} else {
el.innerHTML = vis.map(t => {
const f = FLAVORS[t.flavor];
return `<li class="task${t.done?' done':''}${fresh.has(t.id)?' enter':''}" data-id="${t.id}" style="--fc:${f.color}">
<button class="check${popId===t.id?' pop':''}" data-act="toggle" aria-label="${t.done?'Mark as not done':'Mark as done'}">${t.done?'✓':''}</button>
<span class="txt">${esc(t.text)}</span>
<span class="tag">${f.emoji} ${f.label}</span>
<button class="del" data-act="del" aria-label="Delete task">×</button></li>`;
}).join('');
}
fresh.clear(); popId = null;
const left = S.tasks.filter(t => !t.done).length;
$('count').textContent = left ? `${left} to go` : (S.tasks.length ? 'all done ✦' : '');
$('clearDone').style.visibility = S.tasks.some(t => t.done) ? 'visible' : 'hidden';
};
const renderSettings = () => {
document.documentElement.dataset.theme = S.theme;
document.documentElement.dataset.dark = S.dark ? '1' : '0';
$('swatches').innerHTML = Object.entries(THEMES).map(([k, c]) =>
`<button class="sw" data-theme="${k}" style="background:${c}" aria-label="${k} theme" aria-pressed="${k===S.theme}"></button>`).join('');
$('darkBtn').setAttribute('aria-pressed', S.dark);
$('soundBtn').setAttribute('aria-pressed', !S.mute);
$('soundBtn').textContent = S.mute ? '🔕' : '🔔';
const meta = document.querySelector('meta[name="theme-color"]');
if (meta) meta.content = getComputedStyle(document.documentElement).getPropertyValue('--bg1').trim() || '#ffdfe9';
};
const render = () => {
save();
renderSettings(); renderCake(); renderMascot(); renderPickers(); renderList();
if (document.activeElement !== $('cakeName')) $('cakeName').value = S.name;
};
const addTask = () => {
const inp = $('newTask'), text = inp.value.trim();
const btn = $('addBtn');
btn.classList.remove('bounce'); void btn.offsetWidth; btn.classList.add('bounce');
if (!text) {
inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
say('Type a little thing first ♡', 2500); inp.focus(); return;
}
const t = {id: uid(), text, flavor: selFlavor, done: false};
S.tasks.push(t); fresh.add(t.id); inp.value = '';
sAdd(); buzz(10);
render(); say(pick(ADD_MSGS));
inp.focus();
if (S.filter !== 'all' && S.filter !== t.flavor) { S.filter = 'all'; render(); }
};
const toggle = (id, btnEl) => {
const t = S.tasks.find(x => x.id === id); if (!t) return;
const rect = btnEl ? btnEl.getBoundingClientRect() : null;
t.done = !t.done; popId = id;
const {n, d} = stats();
const allDone = t.done && n > 0 && d === n;
render();
if (t.done) {
cheer();
if (rect) burst(rect.left + rect.width/2, rect.top + rect.height/2, allDone ? 24 : 26);
if (allDone) {
sChime(); buzz([30,40,30,40,80]); bigCelebration();
say('The whole cheesecake is done! Time to treat yourself 🍰✦', 6500);
} else {
sPop(); buzz(18); say(pick(DONE_MSGS));
}
} else {
sUndo(); say(pick(UNDO_MSGS));
}
};
$('addBtn').addEventListener('click', addTask);
$('newTask').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
$('flavorPick').addEventListener('click', e => {
const b = e.target.closest('[data-flavor]'); if (!b) return;
selFlavor = b.dataset.flavor; renderPickers();
});
$('filters').addEventListener('click', e => {
const b = e.target.closest('[data-filter]'); if (!b) return;
S.filter = b.dataset.filter; save(); renderPickers(); renderList();
});
$('list').addEventListener('click', e => {
const b = e.target.closest('[data-act]'); if (!b) return;
const li = b.closest('.task'); if (!li) return;
const id = li.dataset.id;
if (b.dataset.act === 'toggle') toggle(id, b);
else if (b.dataset.act === 'del') {
S.tasks = S.tasks.filter(t => t.id !== id); sUndo(); render(); say('Poof! Gone ♡', 2500);
}
});
$('clearDone').addEventListener('click', () => {
S.tasks = S.tasks.filter(t => !t.done); render(); say('Crumbs swept away ✦', 3000);
});
$('modeBuild').addEventListener('click', () => { S.mode = 'build'; render(); });
$('modeSlice').addEventListener('click', () => { S.mode = 'slice'; render(); });
$('swatches').addEventListener('click', e => {
const b = e.target.closest('[data-theme]'); if (!b) return;
S.theme = b.dataset.theme; render(); say('Fresh new flavor ✦', 2500);
});
$('darkBtn').addEventListener('click', () => {
S.dark = !S.dark; render(); say(S.dark ? 'Cozy night mode ☾' : 'Good morning ♡', 2500);
});
$('soundBtn').addEventListener('click', () => {
S.mute = !S.mute; render();
if (!S.mute) { sPop(); buzz(12); }
say(S.mute ? 'Shh… quiet mode' : 'Sound on ♡', 2500);
});
$('cakeName').addEventListener('input', e => { S.name = e.target.value.trim() || 'Cheesie'; save(); });
$('cakeName').addEventListener('blur', () => { $('cakeName').value = S.name; });
$('cakeName').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
