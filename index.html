<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Cheesecake Tasks</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cheesecake">
<meta name="theme-color" content="#ffdfe9">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#ffdfe9;color:#8a4a62;font-family:Fredoka,ui-rounded,"Avenir Next",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:480px;margin:auto;padding:18px 16px 40px;position:relative}
header{text-align:center;position:relative;padding-top:6px}
.sl{width:150px;display:block;margin:auto;filter:drop-shadow(0 6px 6px rgba(242,124,160,.2))}
.ch{position:absolute;width:34px;animation:b 3.2s ease-in-out infinite}
.sp{position:absolute;color:#fff;text-shadow:0 0 6px #ffb3cc,0 0 2px #f27ca0;animation:tw 2.4s ease-in-out infinite}
@keyframes b{50%{transform:translateY(-6px) rotate(6deg)}}
@keyframes tw{50%{transform:scale(.5) rotate(20deg);opacity:.4}}
@keyframes bt{50%{transform:scale(1.25)}}
@keyframes pop{from{transform:scale(.2) rotate(-30deg)}}
h1{margin:4px 0 0;font-size:32px;font-weight:600;color:#f27ca0}
h1 b{display:inline-block;font-size:24px;animation:bt 1.8s ease-in-out infinite}
.sub{margin:2px 0 0;color:#c47f9a;font-size:15px}
.bar{margin:14px 0 6px;background:#fff6e0;border-radius:20px;height:16px;overflow:hidden;border:2px solid #eec58d}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,#ffb3cc 0 10px,#ffd3e0 10px 20px);transition:width .4s}
.n{text-align:center;color:#c47f9a;font-size:14px;margin-bottom:14px;min-height:18px}
.add{display:flex;gap:8px;background:#fff9fb;padding:8px;border-radius:26px;box-shadow:0 6px 16px rgba(242,124,160,.2);border:2px solid #ffcfde}
input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:17px;color:#8a4a62;padding:8px 12px;outline:0}
input::placeholder{color:#c47f9a}
.add button{border:0;background:#f27ca0;color:#fff;font:inherit;font-weight:600;font-size:16px;padding:0 20px;border-radius:20px;box-shadow:0 3px 0 #d9608a}
.add button:active{transform:translateY(2px);box-shadow:0 1px 0 #d9608a}
ul{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
li{display:flex;align-items:center;gap:12px;background:#fff9fb;border:2px solid #ffcfde;border-radius:26px;padding:10px 12px;box-shadow:0 4px 10px rgba(242,124,160,.2)}
li:nth-child(odd){transform:rotate(-.5deg)}li:nth-child(even){transform:rotate(.5deg)}
li span{flex:1;font-size:18px;line-height:1.25;word-break:break-word}
.d span{text-decoration:line-through;text-decoration-color:#ffb3cc;text-decoration-thickness:2px;opacity:.55}
.t{flex:none;width:40px;height:40px;border-radius:50%;border:3px dashed #ffb3cc;background:#fff;padding:0;display:grid;place-items:center}
.t svg{width:36px;height:36px;display:none}
.d .t{border:0;background:none}.d .t svg{display:block;animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
.x{border:0;background:none;color:#c47f9a;font-size:22px;width:34px;height:34px}
.e{text-align:center;color:#c47f9a;padding:26px 10px;font-size:17px}
.c{display:block;margin:18px auto 0;border:2px solid #ffcfde;background:#fff9fb;color:#c47f9a;font:inherit;font-size:15px;padding:8px 18px;border-radius:20px}
.cr{height:14px;margin:26px auto 0;max-width:200px;border-radius:0 0 16px 16px;background:#eec58d;opacity:.8}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="s" viewBox="0 0 40 40"><path d="M20 37C9 31 5 20 7 14c2-5 8-6 13-4 5-2 11-1 13 4 2 6-2 17-13 23z" fill="#ff5c7f"/><path d="M20 37C9 31 5 20 7 14c1-3 3-4 6-5-2 8 0 19 7 28z" fill="#ff8aa3" opacity=".6"/><g fill="#fff3b0"><ellipse cx="14" cy="19" rx="1.2" ry="1.8"/><ellipse cx="22" cy="17" rx="1.2" ry="1.8"/><ellipse cx="27" cy="23" rx="1.2" ry="1.8"/><ellipse cx="18" cy="26" rx="1.2" ry="1.8"/><ellipse cx="13" cy="26" rx="1.2" ry="1.8"/><ellipse cx="22" cy="30" rx="1.2" ry="1.8"/></g><path d="M20 11l-7-5 5 1-1-4 4 4 4-4-1 4 5-1-7 5z" fill="#6cc27a"/><g fill="#5a2a3c"><circle cx="14" cy="14" r="1.8"/><circle cx="26" cy="14" r="1.8"/></g><g fill="#fff"><circle cx="14.6" cy="13.4" r=".6"/><circle cx="26.6" cy="13.4" r=".6"/></g><path d="M17.5 16.5q2.5 3 5 0" stroke="#5a2a3c" stroke-width="1.2" fill="none" stroke-linecap="round"/><g fill="#ff9db8"><ellipse cx="10.5" cy="17" rx="2.2" ry="1.3"/><ellipse cx="29.5" cy="17" rx="2.2" ry="1.3"/></g></symbol>
<symbol id="c" viewBox="0 0 40 40"><path d="M13 26C14 16 20 9 29 5M27 27C26 17 26 11 29 5" stroke="#5aa86a" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M29 5c4-1 7 1 8 3-4 1-7 0-8-3z" fill="#6cc27a"/><circle cx="13" cy="29" r="8" fill="#e8264f"/><circle cx="27" cy="30" r="8" fill="#ff3f66"/><g fill="#fff" opacity=".7"><ellipse cx="10.5" cy="25" rx="2.2" ry="1.5"/><ellipse cx="24.5" cy="26" rx="2.2" ry="1.5"/></g><g fill="#5a2a3c"><circle cx="10.5" cy="30" r="1.1"/><circle cx="15.5" cy="30" r="1.1"/><circle cx="24.5" cy="31" r="1.1"/><circle cx="29.5" cy="31" r="1.1"/></g><g stroke="#5a2a3c" stroke-width=".9" fill="none" stroke-linecap="round"><path d="M11.5 32.5q1.5 1.5 3 0"/><path d="M25.5 33.5q1.5 1.5 3 0"/></g></symbol>
<symbol id="k" viewBox="0 0 40 40"><path d="M4 30h32v-9H4z" fill="#e9b97a"/><path d="M4 21C4 11 36 11 36 21z" fill="#fff3d6"/><path d="M4 21h32v4H4z" fill="#ffd0de"/><path d="M4 21c3 4 4 0 7 3s4-3 7 2 4-2 7 2 4-3 7 1 3-2 4-4z" fill="#fff3d6"/><circle cx="20" cy="12" r="4.5" fill="#e8264f"/><ellipse cx="18.6" cy="10.8" rx="1.3" ry=".9" fill="#fff" opacity=".7"/><path d="M20 8c0-2 1-3 3-4" stroke="#5aa86a" stroke-width="1.6" fill="none" stroke-linecap="round"/></symbol>
</defs></svg>
<div class="w"><header>
<svg class="ch" style="left:6px;top:36px"><use href="#c"/></svg><svg class="ch" style="right:8px;top:70px;width:28px;animation-delay:-1.4s"><use href="#c"/></svg>
<span class="sp" style="left:56px;top:14px;font-size:22px">✦</span><span class="sp" style="right:52px;top:22px;font-size:18px;animation-delay:-.8s">✧</span><span class="sp" style="right:30px;top:112px;font-size:16px;color:#f27ca0;animation-delay:-1.6s">♡</span>
<svg class="sl" viewBox="0 0 160 120"><path d="M14 78h132v20q0 8-8 8H22q-8 0-8-8z" fill="#e9b97a"/><path d="M14 78C14 40 146 40 146 78z" fill="#fff3d6"/><path d="M14 78h132v12H14z" fill="#ffd0de"/><path d="M14 78c8 12 12 0 22 8s14-8 24 4 14-8 24 2 14-8 24 4 12-6 20-6 8-2 18-4z" fill="#fff3d6"/><ellipse cx="55" cy="59" rx="7" ry="4" fill="#ff9db8" opacity=".6"/><ellipse cx="105" cy="59" rx="7" ry="4" fill="#ff9db8" opacity=".6"/><circle cx="67" cy="52" r="3.4" fill="#5a2a3c"/><circle cx="93" cy="52" r="3.4" fill="#5a2a3c"/><circle cx="68.2" cy="50.8" r="1.2" fill="#fff"/><circle cx="94.2" cy="50.8" r="1.2" fill="#fff"/><path d="M75 56q5 6 10 0" stroke="#5a2a3c" stroke-width="2" fill="none" stroke-linecap="round"/><g transform="translate(40 50) rotate(-18)"><path d="M0 0L-13-8v16zM0 0L13-8v16z" fill="#ff8fb0"/><circle r="4" fill="#ff6f98"/></g><circle cx="80" cy="30" r="12" fill="#e8264f"/><ellipse cx="76" cy="26" rx="4" ry="2.6" fill="#fff" opacity=".7"/><path d="M80 19c0-6 3-9 9-11" stroke="#5aa86a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M89 8c6-2 10 1 11 4-6 2-10 0-11-4z" fill="#6cc27a"/></svg>
<h1>Cheesecake Tasks <b>♡</b></h1><p class="sub">Little things, one slice at a time</p></header>
<div class="bar"><i id="b"></i></div><div class="n" id="n"></div>
<div class="add"><input id="i" placeholder="What’s on the menu today?" autocomplete="off" enterkeyhint="done"><button id="a">Add ♡</button></div>
<ul id="l"></ul><button class="c" id="c" hidden>Clear finished tasks</button><div class="cr"></div></div>
<script>
var K='cheesecake-tasks-v1',T=[],I=['s','c','k'],$=function(x){return document.getElementById(x)};
try{T=JSON.parse(localStorage.getItem(K))||[]}catch(e){}
function S(){try{localStorage.setItem(K,JSON.stringify(T))}catch(e){}}
function R(){var l=$('l');l.innerHTML=T.length?'':'<li class="e" style="display:block;border:0;background:none;box-shadow:none"><svg style="width:70px;display:block;margin:auto"><use href="#s"/></svg>Nothing here yet. Add your first treat!</li>';
T.forEach(function(t,j){var li=document.createElement('li');if(t.d)li.className='d';
li.innerHTML='<button class="t" aria-label="Done"><svg><use href="#'+I[t.i]+'"/></svg></button><span></span><button class="x" aria-label="Delete">×</button>';
li.querySelector('span').textContent=t.x;
li.querySelector('.t').onclick=function(){t.d=!t.d;S();R()};
li.querySelector('.x').onclick=function(){T.splice(j,1);S();R()};l.appendChild(li)});
var n=T.length,k=T.filter(function(t){return t.d}).length;
$('b').style.width=(n?k/n*100:0)+'%';$('n').textContent=n?k+' of '+n+' done'+(k==n?' – yum! 🍰':''):'';$('c').hidden=!k}
function A(){var v=$('i').value.trim();if(!v)return;T.push({x:v,d:0,i:Math.floor(Math.random()*3)});$('i').value='';S();R()}
$('a').onclick=A;$('i').onkeydown=function(e){if(e.key=='Enter')A()};
$('c').onclick=function(){T=T.filter(function(t){return!t.d});S();R()};R();
try{var v=document.createElement('canvas');v.width=v.height=180;var x=v.getContext('2d');x.fillStyle='#ffd3e1';x.fillRect(0,0,180,180);x.font='110px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🍰',90,98);
var e=document.createElement('link');e.rel='apple-touch-icon';e.href=v.toDataURL();document.head.appendChild(e)}catch(e){}
</script></body></html>
